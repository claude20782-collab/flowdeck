<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flowdeck — Offline</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0d12;
    color: #e7e9ee;
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  .mark {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, #e8a849, #c46a4e);
    margin: 0 auto 1.25rem;
    box-shadow: 0 8px 40px rgba(232, 168, 73, .35);
  }
  h1 { font-size: 1.15rem; margin: 0 0 .5rem; font-weight: 600; }
  p { color: #8b90a0; font-size: .9rem; line-height: 1.6; max-width: 34ch; margin: 0 auto; }
  code { color: #e8a849; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>You’re offline</h1>
  <p>Flowdeck needs a connection the first time it loads. Once visited, the app shell works offline — your tasks, notes and sessions always live on your device.</p>
  <p style="margin-top:1.5rem"><code>Reconnect and reload to continue.</code></p>
</main>
</body>
</html>
